[advisories]
version = 2
yanked = "warn"
ignore = [
    # chrono is a mandatory dependency of arrow/parquet 60; the advisory is
    # "unmaintained", not a vulnerability, and no fixed version exists.
    { id = "RUSTSEC-2026-0543", reason = "transitive dependency of arrow 60; unmaintained, not exploitable" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    # ratatui-adjacent and some arrow transitive crates are MPL-2.0; it is
    # file-level copyleft, compatible with our Apache-2.0 distribution.
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
